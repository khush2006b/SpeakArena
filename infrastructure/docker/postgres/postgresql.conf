# =============================================================================
# SpeakArena — PostgreSQL Production Configuration
# Tuned for a 4-core, 8GB RAM VPS running PostgreSQL 16
# Adjust values based on actual server resources.
#
# Based on PGTune recommendations for: OLTP workload, 8GB RAM, 4 CPUs
# https://pgtune.leopard.in.ua/
# =============================================================================

# ---------------------------------------------------------------------------
# Connection Settings
# ---------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100          # Use PgBouncer for connection pooling at scale
superuser_reserved_connections = 3

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
shared_buffers = 2GB           # 25% of RAM
effective_cache_size = 6GB     # 75% of RAM (for query planner estimate)
work_mem = 16MB                # Per sort/hash operation (100 connections = 1.6GB max)
maintenance_work_mem = 512MB   # VACUUM, CREATE INDEX, etc.
wal_buffers = 16MB

# ---------------------------------------------------------------------------
# Write-Ahead Log (WAL)
# ---------------------------------------------------------------------------
wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB
wal_compression = on
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# ---------------------------------------------------------------------------
# Query Planner
# ---------------------------------------------------------------------------
random_page_cost = 1.1         # SSD (default 4.0 is for spinning disk)
seq_page_cost = 1.0
effective_io_concurrency = 200 # SSD: 200; HDD: 2
default_statistics_target = 100
parallelism_on_indexes = on
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_worker_processes = 4

# ---------------------------------------------------------------------------
# Autovacuum (tuned for high write workload)
# ---------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.01
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000   # Log queries slower than 1 second
log_checkpoints = on
log_connections = off               # Noisy; enable for debugging
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# ---------------------------------------------------------------------------
# Statistics
# ---------------------------------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl
track_activity_query_size = 4096

# ---------------------------------------------------------------------------
# Lock Management
# ---------------------------------------------------------------------------
deadlock_timeout = 1s
lock_timeout = 10s
statement_timeout = 60s
idle_in_transaction_session_timeout = 30s

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
