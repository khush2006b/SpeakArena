# =============================================================================
# SpeakArena — Redis Production Configuration
# Redis 7.x · Optimized for session cache + Pub/Sub + rate limiting
# =============================================================================

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
bind 0.0.0.0
port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0
protected-mode no     # Protected by Docker network isolation (no external exposure)

# ---------------------------------------------------------------------------
# Memory Management
# ---------------------------------------------------------------------------
maxmemory 400mb
# allkeys-lru: evict least recently used keys when maxmemory is reached.
# Best for cache-only workload. Sessions use their own TTLs.
maxmemory-policy allkeys-lru
maxmemory-samples 10
lazy-freeing-on-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ---------------------------------------------------------------------------
# Persistence (AOF + RDB hybrid)
# ---------------------------------------------------------------------------
# AOF: log every write operation (most durable)
aof-use-rdb-preamble yes
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec      # Sync AOF every second (good balance of durability/performance)
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
no-appendfsync-on-rewrite no

# RDB: periodic snapshots as backup fallback
save 3600 1              # Save if at least 1 key changed in last hour
save 300 100             # Save if at least 100 keys changed in 5 minutes
save 60 10000            # Save if at least 10000 keys changed in 1 minute
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ---------------------------------------------------------------------------
# Slow Log
# ---------------------------------------------------------------------------
slowlog-log-slower-than 10000   # Log queries slower than 10ms (in microseconds)
slowlog-max-len 128

# ---------------------------------------------------------------------------
# Pub/Sub
# ---------------------------------------------------------------------------
# Required for WebSocket real-time chat broadcasting
# No special config needed; pub/sub does not count against maxmemory
notify-keyspace-events ""    # Disable keyspace notifications unless needed

# ---------------------------------------------------------------------------
# Clients
# ---------------------------------------------------------------------------
maxclients 1000
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit pubsub 32mb 8mb 60
client-output-buffer-limit replica 256mb 64mb 60

# ---------------------------------------------------------------------------
# Lua Scripts
# ---------------------------------------------------------------------------
lua-time-limit 5000

# ---------------------------------------------------------------------------
# Crash Safety
# ---------------------------------------------------------------------------
crash-log-enabled yes
crash-memlog-enabled yes

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
loglevel notice
logfile ""

# ---------------------------------------------------------------------------
# Disable dangerous commands (security hardening)
# ---------------------------------------------------------------------------
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_ADMIN_ONLY_$(openssl rand -hex 8)"
