# =============================================================================
# SpeakArena — Prometheus Configuration
#
# Scrapes metrics from:
#   - FastAPI backend (/metrics endpoint)
#   - PostgreSQL (via postgres-exporter)
#   - Redis (via redis-exporter)
#   - Nginx (via nginx-exporter)
#   - Node (via node-exporter)
#
# Add Prometheus as an optional service in docker-compose.prod.yml
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'speakarena-prod'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:
  # ---------------------------------------------------------------------------
  # FastAPI Application Metrics
  # ---------------------------------------------------------------------------
  - job_name: 'speakarena-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # ---------------------------------------------------------------------------
  # PostgreSQL (via postgres_exporter)
  # Deploy: docker run --network speakarena_backend \
  #   -e DATA_SOURCE_NAME=postgresql://speakarena:pass@db:5432/speakarena_db?sslmode=disable \
  #   quay.io/prometheuscommunity/postgres-exporter
  # ---------------------------------------------------------------------------
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # ---------------------------------------------------------------------------
  # Redis (via redis_exporter)
  # Deploy: docker run --network speakarena_backend \
  #   -e REDIS_ADDR=redis://redis:6379 \
  #   oliver006/redis_exporter
  # ---------------------------------------------------------------------------
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # ---------------------------------------------------------------------------
  # Nginx (via nginx-exporter)
  # Requires stub_status module enabled in nginx.conf
  # ---------------------------------------------------------------------------
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 15s

  # ---------------------------------------------------------------------------
  # Node / Host Metrics
  # Deploy: docker run --network host \
  #   -v /proc:/host/proc:ro -v /sys:/host/sys:ro \
  #   prom/node-exporter
  # ---------------------------------------------------------------------------
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
