# =============================================================================
# SpeakArena — Nginx Main Configuration
# Production-grade: HTTP/2, WebSocket, rate limiting, security headers,
# compression, caching, and large file upload support.
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # Structured JSON access logging
    # -------------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",' 
            '"remote_addr":"$remote_addr",' 
            '"method":"$request_method",' 
            '"uri":"$request_uri",' 
            '"status":$status,' 
            '"bytes":$body_bytes_sent,' 
            '"referrer":"$http_referer",' 
            '"user_agent":"$http_user_agent",' 
            '"x_forwarded_for":"$http_x_forwarded_for",' 
            '"request_id":"$request_id",' 
            '"upstream_addr":"$upstream_addr",' 
            '"upstream_status":"$upstream_status",' 
            '"upstream_response_time":"$upstream_response_time",' 
            '"request_time":"$request_time",' 
            '"ssl_protocol":"$ssl_protocol",' 
            '"ssl_cipher":"$ssl_cipher"'
        '}';

    access_log /var/log/nginx/access.log json_combined buffer=16k flush=5s;

    # -------------------------------------------------------------------------
    # Core performance settings
    # -------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 1000;
    reset_timedout_connection on;
    types_hash_max_size 2048;
    server_tokens off;

    # Large file upload support (video uploads via presigned R2 pass-through)
    client_max_body_size 512m;
    client_body_timeout 300s;
    client_header_timeout 30s;
    send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;

    # Buffers
    client_body_buffer_size 1m;
    proxy_buffer_size 8k;
    proxy_buffers 32 8k;
    proxy_busy_buffers_size 64k;

    # -------------------------------------------------------------------------
    # Compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # -------------------------------------------------------------------------
    # SSL/TLS — global settings
    # -------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Rate limiting zones
    # -------------------------------------------------------------------------
    # Auth endpoints — tight limit to prevent brute force
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Registration — prevent abuse
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=10r/h;

    # General API endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/m;

    # WebSocket connections
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # Upload endpoints
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/m;

    # -------------------------------------------------------------------------
    # Upstream — FastAPI application
    # -------------------------------------------------------------------------
    upstream api_backend {
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Request ID propagation
    # -------------------------------------------------------------------------
    map $http_x_request_id $request_id_value {
        default $http_x_request_id;
        ""      $request_id;
    }

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Real IP from Cloudflare (CF-Connecting-IP header)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Include vhost configs
    include /etc/nginx/conf.d/*.conf;
}
