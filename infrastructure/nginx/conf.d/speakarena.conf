# =============================================================================
# SpeakArena — HTTPS vhost configuration
# Handles: API reverse proxy, WebSocket, security headers, rate limiting
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP → HTTPS redirect (port 80)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.speakarena.com speakarena.com www.speakarena.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS API server — api.speakarena.com
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.speakarena.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.speakarena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.speakarena.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.speakarena.com/chain.pem;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; connect-src 'self' wss://api.speakarena.com; img-src 'self' data: https://storage.speakarena.com; script-src 'none'; style-src 'none'; frame-ancestors 'none'" always;
    add_header X-Request-ID $request_id_value always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Remove server header (already off in nginx.conf, belt-and-suspenders)
    more_clear_headers Server;

    # -------------------------------------------------------------------------
    # WebSocket — /ws/chat/{room_id}
    # -------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;

        # Long-lived WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;

        # Disable buffering for WebSocket
        proxy_buffering off;

        # Limit concurrent WS connections per IP
        limit_conn ws_conn 20;

        # No caching for WS
        add_header Cache-Control "no-store" always;
    }

    # -------------------------------------------------------------------------
    # Auth endpoints — tight rate limiting
    # -------------------------------------------------------------------------
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;
    }

    # -------------------------------------------------------------------------
    # Upload endpoints — relaxed body size, dedicated rate limit
    # -------------------------------------------------------------------------
    location ~ ^/api/v1/(videos|pdfs|chat/.*/attachments) {
        client_max_body_size 512m;
        limit_req zone=upload_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;
        proxy_request_buffering off;  # Stream large uploads directly
    }

    # -------------------------------------------------------------------------
    # Webhook endpoints — no rate limit (Razorpay must always reach us)
    # -------------------------------------------------------------------------
    location /api/v1/payments/webhook {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;
    }

    # -------------------------------------------------------------------------
    # Health endpoints — allow monitoring without rate limiting
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # -------------------------------------------------------------------------
    # All other API endpoints — standard rate limiting
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id_value;
        proxy_set_header X-Forwarded-Host $host;

        # Enable proxy caching for GET requests to static resources
        proxy_cache_bypass $http_pragma $http_authorization;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # -------------------------------------------------------------------------
    # Block common scanner paths
    # -------------------------------------------------------------------------
    location ~ (\.(php|asp|aspx|jsp|cgi|env|git|htaccess|htpasswd)|wp-admin|admin|phpmyadmin) {
        deny all;
        return 444;
    }
}
