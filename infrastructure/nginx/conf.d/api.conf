# =============================================================================
# SpeakArena — API server block
# Handles HTTPS termination and proxying to the FastAPI backend.
# =============================================================================

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name api.speakarena.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS API server ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.speakarena.com;

    # --- SSL certificates (Let's Encrypt via certbot) ---
    ssl_certificate     /etc/letsencrypt/live/api.speakarena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.speakarena.com/privkey.pem;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Propagate request ID ---
    add_header X-Request-ID $request_id_value always;

    # --- Rate limiting zones ---
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=register:10m rate=10r/h;
    limit_req_zone $binary_remote_addr zone=api_global:10m rate=100r/m;

    # --- /api/v1/auth/login — strict rate limit ---
    location = /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # --- /api/v1/auth/register ---
    location = /api/v1/auth/register {
        limit_req zone=register burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # --- WebSocket connections ---
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id_value;
        proxy_read_timeout 86400s;    # Long-lived WS connections
        proxy_send_timeout 86400s;
    }

    # --- All other API routes ---
    location / {
        limit_req zone=api_global burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # --- Razorpay webhook (no rate limit — webhook IPs are fixed) ---
    location = /api/v1/payments/webhook {
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
