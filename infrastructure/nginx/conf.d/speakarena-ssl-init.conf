# =============================================================================
# SpeakArena — HTTP-only server block for initial Let's Encrypt provisioning
#
# Usage:
#   1. Place this file as the ONLY file in conf.d/
#   2. Run: ./infrastructure/scripts/ssl-init.sh
#   3. Replace with speakarena.conf after certs are issued
#
# This file is NOT used in production. It is included in git for reference.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.speakarena.com;

    # Serve ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Serve a basic 200 for health checks during provisioning
    location /health {
        default_type application/json;
        return 200 '{"status":"provisioning"}';
    }

    # Reject everything else
    location / {
        return 503 'SSL provisioning in progress. Please try again shortly.';
    }
}
