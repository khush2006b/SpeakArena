[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -v
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: Unit tests with no external dependencies (no DB, no Redis).
    integration: Tests that require a live PostgreSQL database and Redis.
    api: Tests that exercise HTTP endpoints via the ASGI test client.
    slow: Tests that are expected to take more than one second.
