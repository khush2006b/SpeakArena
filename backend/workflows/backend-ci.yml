# =============================================================================
# SpeakArena — Backend CI Pipeline
#
# Triggered on: Pull requests targeting main (backend/** changes)
# Jobs: quality → test → build
#
# Enforces:
#   - Ruff lint + format check
#   - Mypy strict type checking
#   - Bandit SAST (security analysis)
#   - pip-audit (CVE scan on dependencies)
#   - Unit + integration tests with real Postgres + Redis
#   - ≥80% code coverage gate
#   - Docker build + Trivy vulnerability scan
# =============================================================================

name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.13"
  POSTGRES_USER: speakarena
  POSTGRES_PASSWORD: ci_test_password_change_me
  POSTGRES_DB: speakarena_test

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Code quality — lint, format, type check, security scan
  # ---------------------------------------------------------------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy strict type check
        run: mypy app/ --strict --ignore-missing-imports

      - name: Bandit SAST scan
        run: bandit -r app/ -ll -x tests/ -f json -o bandit-report.json || true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 30

      - name: pip-audit dependency CVE scan
        run: pip-audit --requirement requirements.txt --skip-editable --format json --output pip-audit-report.json || true

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 2: Tests — unit + integration against real PostgreSQL + Redis
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speakarena"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: ci-test-secret-key-minimum-32-characters-long-value
      DATABASE_URL: postgresql+asyncpg://speakarena:ci_test_password_change_me@localhost:5432/speakarena_test
      DATABASE_SYNC_URL: postgresql+psycopg2://speakarena:ci_test_password_change_me@localhost:5432/speakarena_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-jwt-secret-key-minimum-32-chars-long-value
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "30"
      R2_ACCOUNT_ID: test-account-id
      R2_ACCESS_KEY_ID: test-access-key
      R2_SECRET_ACCESS_KEY: test-secret-key
      R2_BUCKET_NAME: test-bucket
      R2_PUBLIC_URL: https://test.r2.dev
      R2_PRESIGNED_URL_EXPIRY_UPLOAD: "900"
      R2_PRESIGNED_URL_EXPIRY_STREAM: "3600"
      R2_PRESIGNED_URL_EXPIRY_DOWNLOAD: "1800"
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci_secret_key
      RAZORPAY_WEBHOOK_SECRET: ci_webhook_secret
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USERNAME: test
      SMTP_PASSWORD: test
      SMTP_FROM_EMAIL: test@speakarena.com
      SMTP_FROM_NAME: SpeakArena CI
      SENTRY_DSN: ""
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-branch \
            -v \
            --tb=short

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --cov=app \
            --cov-append \
            --cov-report=xml \
            --cov-branch \
            -v \
            --tb=short
        continue-on-error: false

      - name: Enforce coverage threshold (≥80%)
        run: coverage report --fail-under=80

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: |
            backend/coverage.xml
            backend/.coverage
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 3: Docker build + vulnerability scan
  # ---------------------------------------------------------------------------
  build:
    name: Docker Build + Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push on PR)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: speakarena-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Scan image with Trivy (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: speakarena-backend:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ---------------------------------------------------------------------------
  # Job 4: PR summary comment
  # ---------------------------------------------------------------------------
  comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [quality, test, build]
    if: github.event_name == 'pull_request'

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.build.result }}' === 'success' ? '✅' : '❌';
            const body = [
              `## ${status} CI Results for \`${{ github.head_ref }}\``,
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| Code Quality (lint, type, security) | ${{ needs.quality.result }} |`,
              `| Tests (unit + integration, ≥80% coverage) | ${{ needs.test.result }} |`,
              `| Docker Build + Trivy Scan | ${{ needs.build.result }} |`,
              '',
              `Commit: \`${{ github.sha }}\``,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
