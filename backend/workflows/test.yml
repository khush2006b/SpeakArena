name: Test Suite

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

# Cancel in-progress runs on new push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Frontend Tests (Next.js 15 / Jest / RTL)
  # ──────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: "Frontend — Jest + RTL"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npx jest --testPathPattern="unit/" --coverage --ci
        env:
          CI: true
          NODE_ENV: test

      - name: Run integration tests (hooks)
        run: npx jest --testPathPattern="integration/" --coverage --ci
        env:
          CI: true
          NODE_ENV: test

      - name: Enforce coverage thresholds
        run: |
          npx jest --coverage --coverageThreshold='{"global":{"branches":80,"functions":85,"lines":85,"statements":85}}' --ci
        env:
          CI: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: frontend/coverage
          flags: frontend
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            frontend/coverage/
            frontend/reports/jest/junit.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # Backend Tests (FastAPI / pytest)
  # ──────────────────────────────────────────────────────────────────────────
  backend-unit-tests:
    name: "Backend — Unit Tests (no DB)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit \
            -m unit \
            --cov=app \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -q
        env:
          JWT_SECRET_KEY: "ci-test-secret-key-for-jwt-signing-only"
          JWT_ALGORITHM: "HS256"
          DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost:5432/unused"
          REDIS_URL: "redis://localhost:6379/0"
          RAZORPAY_KEY_ID: "ci_test_key"
          RAZORPAY_KEY_SECRET: "ci_test_secret"
          RAZORPAY_WEBHOOK_SECRET: "ci_test_webhook_secret"
          ENVIRONMENT: "test"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage-unit.xml
          flags: backend-unit

  backend-api-tests:
    name: "Backend — API Tests (mocked DB)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests with coverage
        run: |
          pytest tests/api \
            -m api \
            --cov=app \
            --cov-report=xml:coverage-api.xml \
            --cov-report=term-missing \
            -q
        env:
          JWT_SECRET_KEY: "ci-test-secret-key-for-jwt-signing-only"
          JWT_ALGORITHM: "HS256"
          DATABASE_URL: "postgresql+asyncpg://unused:unused@localhost:5432/unused"
          REDIS_URL: "redis://localhost:6379/0"
          RAZORPAY_KEY_ID: "ci_test_key"
          RAZORPAY_KEY_SECRET: "ci_test_secret"
          RAZORPAY_WEBHOOK_SECRET: "ci_test_webhook_secret"
          ENVIRONMENT: "test"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage-api.xml
          flags: backend-api

  backend-integration-tests:
    name: "Backend — Integration Tests (real DB)"
    runs-on: ubuntu-latest
    # Only run on main branch pushes or when explicitly requested via label
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-integration')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: speakarena
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: speakarena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: "postgresql+asyncpg://speakarena:testpassword@localhost:5432/speakarena_test"

      - name: Run integration tests
        run: |
          pytest tests/integration \
            -m integration \
            --cov=app \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            -q
        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://speakarena:testpassword@localhost:5432/speakarena_test"
          TEST_REDIS_URL: "redis://localhost:6379/15"
          JWT_SECRET_KEY: "ci-integration-secret-key"
          JWT_ALGORITHM: "HS256"
          DATABASE_URL: "postgresql+asyncpg://speakarena:testpassword@localhost:5432/speakarena_test"
          REDIS_URL: "redis://localhost:6379/0"
          RAZORPAY_KEY_ID: "ci_test_key"
          RAZORPAY_KEY_SECRET: "ci_test_secret"
          RAZORPAY_WEBHOOK_SECRET: "ci_test_webhook_secret"
          ENVIRONMENT: "test"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage-integration.xml
          flags: backend-integration

  # ──────────────────────────────────────────────────────────────────────────
  # Coverage Gate — must pass before merge
  # ──────────────────────────────────────────────────────────────────────────
  coverage-gate:
    name: "Coverage Gate"
    runs-on: ubuntu-latest
    needs:
      - frontend-tests
      - backend-unit-tests
      - backend-api-tests

    steps:
      - name: All coverage checks passed
        run: echo "✅ All coverage thresholds met. Ready to merge."
