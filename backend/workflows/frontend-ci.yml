# =============================================================================
# SpeakArena — Frontend CI Pipeline
#
# Triggered on: Pull requests targeting main
# Jobs: quality (TypeScript + ESLint + Prettier) → build
# =============================================================================

name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Code quality — TypeScript, ESLint, Prettier
  # ---------------------------------------------------------------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

  # ---------------------------------------------------------------------------
  # Job 2: Build — verify production build succeeds
  # ---------------------------------------------------------------------------
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: https://api.speakarena.com
      NEXT_PUBLIC_APP_URL: https://speakarena.com
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js application
        run: npm run build

      - name: Check bundle size
        run: |
          du -sh .next/
          echo "Build succeeded"
