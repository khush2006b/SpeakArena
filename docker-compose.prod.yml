# =============================================================================
# SpeakArena — Production Docker Compose
#
# Usage on VPS:
#   docker compose -f docker-compose.prod.yml --env-file /etc/speakarena/.env.prod up -d
#
# Prerequisites:
#   - /etc/speakarena/.env.prod          (production secrets)
#   - /var/speakarena/ssl/               (Let's Encrypt certs)
#   - /var/speakarena/data/postgres/     (postgres data volume mount)
#   - /var/speakarena/data/redis/        (redis data volume mount)
#   - /var/speakarena/logs/              (centralized log directory)
#   - /var/speakarena/backups/           (backup output directory)
# =============================================================================

name: speakarena-prod

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16
    container_name: speakarena_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infrastructure/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - /var/speakarena/backups/postgres:/backups
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: speakarena_redis
    restart: always
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./infrastructure/docker/redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:${IMAGE_TAG:-latest}
    container_name: speakarena_api
    restart: always
    env_file:
      - /etc/speakarena/.env.prod
    environment:
      APP_ENV: production
      DEBUG: "false"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    networks:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy + SSL Termination
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: speakarena_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - /var/speakarena/ssl:/etc/letsencrypt:ro
      - /var/speakarena/ssl/www:/var/www/certbot:ro
      - /var/speakarena/logs/nginx:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  # ---------------------------------------------------------------------------
  # Certbot (Runs as a one-shot / renewal container)
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: speakarena_certbot
    restart: "no"
    volumes:
      - /var/speakarena/ssl:/etc/letsencrypt
      - /var/speakarena/ssl/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    profiles:
      - ssl

networks:
  backend:
    driver: bridge
    name: speakarena_backend
    internal: true    # Backend network is not exposed to host
  frontend:
    driver: bridge
    name: speakarena_frontend

volumes:
  postgres_data:
    name: speakarena_postgres_data_prod
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/speakarena/data/postgres
  redis_data:
    name: speakarena_redis_data_prod
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/speakarena/data/redis
