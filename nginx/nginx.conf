worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Define an upstream block for FastAPI to enable load balancing
    # The 'ip_hash' directive is CRITICAL for Socket.IO polling.
    # It ensures a client is always routed to the same worker process,
    # preventing "Session ID unknown" errors during the WebSockets handshake.
    upstream backend_servers {
        ip_hash;
        server backend:8000;
        # server backend2:8000; # Example of scaling
    }

    server {
        listen 80;
        server_name api.speakarena.com localhost;

        # Standard API routing
        location /api/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dedicated Socket.IO routing with WebSocket upgrade support
        location /socket.io/ {
            proxy_pass http://backend_servers;
            
            # These headers are required to upgrade HTTP to WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            # Pass IP headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Increase timeouts for long-lived WebSocket connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
